name: politicall-local

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: database_name
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - politicall_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d database_name"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://username:password@db:5432/database_name
      ALLOW_DEVELOPMENT_SEED: seed-development-data
      PUBLIC_APP_URL: http://localhost:${APP_PORT:-5000}
      PUBLIC_APP_ORIGINS: http://localhost:${APP_PORT:-5000}
      SESSION_SECRET: local-development-session-secret-change-before-production
      DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      TOKEN_FINGERPRINT_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      ENABLE_BEARER_AUTH: "false"
      ENABLE_BEARER_EXCHANGE: "false"
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:5000"
    volumes:
      - .:/app
      - politicall_node_modules:/app/node_modules
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    restart: unless-stopped

volumes:
  politicall_postgres_data:
  politicall_node_modules:
