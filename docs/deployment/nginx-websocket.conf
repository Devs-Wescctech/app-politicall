# Place the map in the http context, then include the location in the HTTPS server block.
# This upstream matches the default APP_PORT=5000. If APP_PORT changes, update this proxy_pass port in the same change and test the local health endpoints before reloading Nginx.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

location = /api/attendance/realtime {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 30s;
    proxy_buffering off;
}
