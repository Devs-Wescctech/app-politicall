# This file intentionally contains two Nginx snippets. Do not include the whole
# file inside one server block.
#
# 1) Place this map in the http context.
#
# This upstream matches the default APP_PORT=5000. If APP_PORT changes, update this proxy_pass port in the same change and test local health endpoints before reloading Nginx.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 2) Place this exact location in the HTTPS server block that serves the
# Politicall domain.
#
# Exact route used by the attendance operator UI. This route must preserve the
# Upgrade and Cookie headers; do not move browser authentication into query
# strings or Bearer-token URL parameters.
location = /api/attendance/realtime {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 30s;
    proxy_buffering off;
    proxy_cache off;
}

# Validation handoff:
# 1. Run `nginx -t` before reload.
# 2. Verify `/api/health` and `/api/ready` through the same server block.
# 3. With an authenticated browser session, open the attendance screen and
#    confirm the status badge reaches "Conectado".
# 4. Only keep traffic open when the browser Network panel shows HTTP 101 for
#    `/api/attendance/realtime` and the operator still receives inbound
#    messages. The HTTP polling fallback is a resilience path, not a substitute
#    for the production WebSocket route.
