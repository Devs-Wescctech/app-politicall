name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '24.18.0'

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run check

  build:
    name: Test and Build Application
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      POSTGRES_PASSWORD: ${{ github.run_id }}
    services:
      postgres:
        image: postgres:16
        ports: [5432:5432]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure migration integration database
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const databaseUrl = new URL('postgresql://127.0.0.1:5432/postgres');
          databaseUrl.username = 'postgres';
          databaseUrl.password = process.env.POSTGRES_PASSWORD;
          appendFileSync(process.env.GITHUB_ENV, `MIGRATION_TEST_DATABASE_URL=${databaseUrl}\n`);
          NODE

      - name: Run automated tests including PostgreSQL migrations
        run: npm test

      - name: Build application
        run: npm run build

  security:
    name: Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan for committed secrets
        run: npm run security:secrets

      - name: Run security audit
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Scan and Publish Docker Image
    runs-on: ubuntu-latest
    needs: [typecheck, build, security]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Derive immutable image reference
        id: image
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          IMAGE_REFERENCE=ghcr.io/${repository}:sha-${GITHUB_SHA}
          echo "IMAGE_REFERENCE=${IMAGE_REFERENCE}" >> "$GITHUB_ENV"
          echo "reference=${IMAGE_REFERENCE}" >> "$GITHUB_OUTPUT"

      - name: Build local Docker candidate
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.reference }}
          load: true
          push: false

      - name: Scan local Docker candidate with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.reference }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned Docker candidate
        run: docker push "$IMAGE_REFERENCE"

      - name: Record published image digest
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE_REFERENCE" --format '{{.Manifest.Digest}}')"
          {
            echo "## Published Docker image"
            echo
            echo "- Image: \`$IMAGE_REFERENCE\`"
            echo "- Digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
