name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '24.18.0'

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run check

  build:
    name: Test and Build Application
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      POSTGRES_PASSWORD: ${{ github.run_id }}
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20 # reviewed 2026-07-29
        ports: [5432:5432]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure migration integration database
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { randomBytes } from 'node:crypto';

          const databaseUrl = new URL('postgresql://127.0.0.1:5432/postgres');
          databaseUrl.username = 'postgres';
          databaseUrl.password = process.env.POSTGRES_PASSWORD;
          appendFileSync(process.env.GITHUB_ENV, `MIGRATION_TEST_DATABASE_URL=${databaseUrl}\n`);
          appendFileSync(process.env.GITHUB_ENV, `DATA_ENCRYPTION_KEY=${randomBytes(32).toString('base64')}\n`);
          appendFileSync(process.env.GITHUB_ENV, `TOKEN_FINGERPRINT_KEY=${randomBytes(32).toString('base64')}\n`);
          NODE

      - name: Run automated tests including PostgreSQL migrations
        run: npm test

      - name: Build application
        run: npm run build

  security:
    name: Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan for committed secrets
        run: npm run security:secrets

      - name: Run security audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Critical Browser Flows
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      POSTGRES_PASSWORD: ${{ github.run_id }}
      E2E_PORT: '5010'
      E2E_BASE_URL: http://127.0.0.1:5010
      ALLOW_DEVELOPMENT_SEED: seed-development-data
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20 # reviewed 2026-07-29
        ports: [5432:5432]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure isolated E2E database
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { randomBytes } from 'node:crypto';

          const databaseUrl = new URL('postgresql://127.0.0.1:5432/postgres');
          databaseUrl.username = 'postgres';
          databaseUrl.password = process.env.POSTGRES_PASSWORD;
          appendFileSync(process.env.GITHUB_ENV, `DATABASE_URL=${databaseUrl}\n`);
          appendFileSync(process.env.GITHUB_ENV, `SESSION_SECRET=${randomBytes(48).toString('base64url')}\n`);
          appendFileSync(process.env.GITHUB_ENV, `DATA_ENCRYPTION_KEY=${randomBytes(32).toString('base64')}\n`);
          appendFileSync(process.env.GITHUB_ENV, `TOKEN_FINGERPRINT_KEY=${randomBytes(32).toString('base64')}\n`);
          NODE

      - name: Bootstrap E2E database
        run: npx tsx scripts/setup-dev-db.ts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run critical browser flows
        run: npm run test:e2e -- --project=chromium

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    needs: [typecheck, build, security, e2e]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    outputs:
      image_reference: ${{ steps.image.outputs.reference }}
      archive_sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Derive immutable image reference
        id: image
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          IMAGE_REFERENCE=ghcr.io/${repository}:sha-${GITHUB_SHA}
          echo "IMAGE_REFERENCE=${IMAGE_REFERENCE}" >> "$GITHUB_ENV"
          echo "reference=${IMAGE_REFERENCE}" >> "$GITHUB_OUTPUT"

      - name: Build local Docker candidate
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.reference }}
          load: true
          push: false

      - name: Scan local Docker candidate with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.reference }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Archive scanned Docker candidate
        id: archive
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/politicall-image.tar.gz"
          docker save "$IMAGE_REFERENCE" | gzip -n > "$archive_path"
          archive_sha256="$(sha256sum "$archive_path" | awk '{print $1}')"
          if [[ ! "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Failed to calculate the Docker archive checksum" >&2
            exit 1
          fi
          echo "path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "sha256=$archive_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload scanned Docker candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanned-docker-image-${{ github.run_attempt }}
          path: ${{ steps.archive.outputs.path }}
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish Scanned Docker Image
    runs-on: ubuntu-latest
    needs: docker
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      packages: write
    env:
      IMAGE_REFERENCE: ${{ needs.docker.outputs.image_reference }}
    steps:
      - name: Download scanned Docker candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scanned-docker-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scanned-docker-image

      - name: Verify scanned Docker archive checksum
        id: checksum
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.docker.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/scanned-docker-image/politicall-image.tar.gz"
          if [[ ! -f "$archive_path" ]]; then
            echo "Scanned Docker archive is missing" >&2
            exit 1
          fi
          actual_archive_sha256="$(sha256sum "$archive_path" | awk '{print $1}')"
          if [[ ! "$EXPECTED_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]] || \
             [[ "$actual_archive_sha256" != "$EXPECTED_ARCHIVE_SHA256" ]]; then
            echo "Scanned Docker archive checksum mismatch" >&2
            exit 1
          fi
          echo "path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Load scanned Docker candidate
        run: |
          set -euo pipefail
          gunzip -c "${{ steps.checksum.outputs.path }}" | docker load

      - name: Verify loaded Docker tag
        run: |
          if ! docker image inspect "$IMAGE_REFERENCE" > /dev/null 2>&1; then
            echo "Expected Docker image tag was not loaded" >&2
            exit 1
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned Docker candidate
        run: |
          set -euo pipefail
          if ! push_output="$(docker push "$IMAGE_REFERENCE" 2>&1)"; then
            printf '%s\n' "$push_output" >&2
            exit 1
          fi
          printf '%s\n' "$push_output"
          if [[ "$push_output" =~ digest:[[:space:]](sha256:[0-9a-f]{64})([[:space:]]|$) ]]; then
            digest="${BASH_REMATCH[1]}"
          else
            echo "Docker push did not return a valid manifest digest" >&2
            exit 1
          fi
          repository="${IMAGE_REFERENCE%:*}"
          {
            echo "## Published Docker image"
            echo
            echo "- Image: \`${repository}@${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
